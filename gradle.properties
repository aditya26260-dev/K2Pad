# Project-wide Gradle settings.

# Give Gradle more heap for the native (CMake/NDK) + Compose build.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

# Speed up multi-module / repeated builds.
org.gradle.parallel=true
org.gradle.caching=true

# Use AndroidX package structure to make it easier to migrate your app to
# newer versions of support libraries. This is required by K2Pad's dependencies.
android.useAndroidX=true

# Generate a non-transitive R class per module (smaller, faster builds).
android.nonTransitiveRClass=true

# Kotlin code style used by IDE formatters.
kotlin.code.style=official

name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK environment
        # ubuntu-latest runners ship with an Android SDK already installed
        # (github.com/actions/runner-images) — no separate setup action is
        # needed, just point at it and put its cmdline-tools on PATH.
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install required Android SDK + NDK components
        # Explicit package list instead of a third-party action: avoids
        # android-actions/setup-android's own "sdkmanager tools" call, which
        # fails outright since Google removed the legacy 'tools' package —
        # confirmed in that action's own docs, not something on our side.
        # `|| true` on the license line specifically: `yes | sdkmanager` can
        # exit via SIGPIPE once sdkmanager stops reading, which GitHub
        # Actions' pipefail-enabled bash would otherwise treat as a failure
        # even though the licenses were accepted fine.
        run: |
          yes | sdkmanager --licenses || true

          # API 37's platform package apparently shifted to a minor-suffixed
          # name (platforms;android-37.0) instead of the bare
          # "platforms;android-37" every earlier API level used — discover
          # the real installable name from the live repository listing
          # instead of hardcoding a second guess, with a safe fallback to
          # the last API level already confirmed to exist under the plain
          # name.
          PLATFORM_PKG=$(sdkmanager --list 2>/dev/null | grep -oE "platforms;android-37(\.[0-9]+)?" | sort -V | tail -n1)
          if [ -z "$PLATFORM_PKG" ]; then
            echo "No android-37 platform package found; falling back to android-36"
            PLATFORM_PKG="platforms;android-36"
          fi
          echo "Installing platform package: $PLATFORM_PKG"

          sdkmanager "platform-tools" "$PLATFORM_PKG" "build-tools;36.0.0" "ndk;28.2.13676358"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run JVM unit tests
        run: ./gradlew test --stacktrace

      - name: Assemble debug APK (also compiles the CMake/JNI native stub)
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: k2pad-debug-apk
          path: app/build/outputs/apk/debug/*.apk
